<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Orbly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/legal.css">
<style>
  /* Convite (orbly.chat/convite/CODIGO) e pagina que nao existe. O GitHub Pages
     manda qualquer endereco desconhecido pra ca; o script decide o que mostrar. */
  main.invite { min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 32px 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .card h1 { font: 600 26px/1.25 var(--display); margin: 0; color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: 16px; }
  .eyebrow { color: var(--muted); font-size: 15px; }
  .icon { width: 88px; height: 88px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font: 600 30px/1 var(--display); color: #04342c; background: var(--planet); overflow: hidden; margin: 6px 0 4px; }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .meta { display: flex; flex-direction: column; gap: 2px; font-size: 15px; color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 12px; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; border: 1px solid transparent; padding: 14px 24px; font: 600 17px/1 var(--display); text-decoration: none; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  .pill:active { transform: scale(.97); }
  .pill.primary { background: var(--planet); color: #04342c; }
  .pill.primary:hover { background: #27ad93; }
  .pill.outline { border-color: var(--line); color: var(--text); background: none; }
  .pill.outline:hover { border-color: var(--planet); }
  .hint { font-size: 14px !important; }
  .gem { width: 56px; height: 56px; border-radius: 16px; transform: rotate(45deg); background: #ff5c7a22; border: 2px solid #ff5c7a; margin: 10px 0 14px; display: flex; align-items: center; justify-content: center; }
  .gem span { transform: rotate(-45deg); font: 600 26px/1 var(--display); color: #ff5c7a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="root" data-lang="en">
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/favicon.svg" width="32" height="32" alt="">Orbly</a>
    <div class="langs"></div>
  </div>
</header>

<main class="invite">
  <div class="card" id="loading"><p data-k="loading"></p></div>

  <div class="card" id="valid" hidden>
    <span class="eyebrow" data-k="invited"></span>
    <div class="icon" id="gicon"></div>
    <h1 id="gname"></h1>
    <div class="meta"><span id="gmembers"></span><span id="ginviter"></span></div>
    <div class="actions">
      <a class="pill primary" id="open" href="#" data-k="open"></a>
      <a class="pill outline" id="download" href="https://github.com/orblyapp/orblyapp.github.io/releases/latest/download/Orbly-Setup.exe" data-k="download"></a>
    </div>
    <p class="hint" data-k="hint"></p>
  </div>

  <div class="card" id="invalid" hidden>
    <div class="gem"><span>!</span></div>
    <h1 data-k="invalidTitle"></h1>
    <p data-k="invalidText"></p>
    <div class="actions"><a class="pill outline" href="/" data-k="home"></a></div>
  </div>

  <div class="card" id="notfound" hidden>
    <h1 data-k="notFoundTitle"></h1>
    <p data-k="notFoundText"></p>
    <div class="actions"><a class="pill outline" href="/" data-k="home"></a></div>
  </div>
</main>
</div>

<script src="/site-i18n.js"></script>
<script>
(function () {
  // Textos: portugues e ingles aqui; os outros idiomas vem de /i18n/<codigo>.json (chaves invite.*)
  var PT = {
    loading: 'Abrindo o convite...', invited: 'Você foi convidado pra entrar em', members1: '1 membro', membersN: '{n} membros',
    invitedBy: 'Convite de {name}', open: 'Abrir no Orbly', download: 'Baixar o Orbly',
    hint: 'Ainda não tem o Orbly? Baixe, instale e depois clique em Abrir no Orbly. Por enquanto só para Windows.',
    invalidTitle: 'Esse convite não vale mais', invalidText: 'Ele venceu, chegou no limite de usos ou foi cancelado. Peça um link novo pra quem te convidou.',
    notFoundTitle: 'Página não encontrada', notFoundText: 'Esse endereço não existe no orbly.chat.', home: 'Ir pra página inicial', title: 'Convite pro {server} · Orbly'
  };
  var EN = {
    loading: 'Opening the invite...', invited: 'You’ve been invited to join', members1: '1 member', membersN: '{n} members',
    invitedBy: 'Invite from {name}', open: 'Open in Orbly', download: 'Download Orbly',
    hint: 'Don’t have Orbly yet? Download it, install it, then click Open in Orbly. Windows only for now.',
    invalidTitle: 'This invite is no longer valid', invalidText: 'It expired, hit its use limit or was cancelled. Ask whoever invited you for a new link.',
    notFoundTitle: 'Page not found', notFoundText: 'That address doesn’t exist on orbly.chat.', home: 'Go to the home page', title: 'Invite to {server} · Orbly'
  };
  function tr(key, vars) {
    var lang = window.OrblyI18n ? window.OrblyI18n.lang : 'en';
    var text = lang === 'pt' ? PT[key] : lang === 'en' ? EN[key] : ((window.OrblyI18n && window.OrblyI18n.t('invite.' + key)) || EN[key]);
    return String(text || '').replace(/\{(\w+)\}/g, function (_m, k) { return vars && vars[k] != null ? vars[k] : ''; });
  }

  var q = new URLSearchParams(location.search);
  var m = /^\/convite\/([A-Za-z0-9]{4,16})\/?$/.exec(location.pathname);
  var code = m ? m[1] : (/^[A-Za-z0-9]{4,16}$/.test(q.get('c') || '') ? q.get('c') : null);
  // Servidor do Orbly (so da pra trocar pra um servidor local, nos testes)
  var API = 'https://api.orbly.chat';
  var asked = q.get('api') || '';
  if (/^http:\/\/localhost:\d+$/.test(asked)) API = asked;

  var state = code ? 'loading' : 'notfound';
  var invite = null;

  function show(id) {
    ['loading', 'valid', 'invalid', 'notfound'].forEach(function (x) { document.getElementById(x).hidden = x !== id; });
  }
  function render() {
    var nodes = document.querySelectorAll('[data-k]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = tr(nodes[i].getAttribute('data-k'));
    if (state === 'valid' && invite) {
      var g = invite.guild;
      document.getElementById('gname').textContent = g.name;
      document.getElementById('gmembers').textContent = g.member_count === 1 ? tr('members1') : tr('membersN', { n: g.member_count });
      document.getElementById('ginviter').textContent = invite.inviter ? tr('invitedBy', { name: invite.inviter }) : '';
      document.title = tr('title', { server: g.name });
    } else {
      document.title = 'Orbly';
    }
    show(state);
  }
  if (window.OrblyI18n) window.OrblyI18n.onChange(render);

  if (code) {
    document.getElementById('open').href = 'orbly://convite/' + code;
    fetch(API + '/api/invites/' + code, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.invite) { state = 'invalid'; render(); return; }
        invite = data.invite;
        var icon = document.getElementById('gicon');
        icon.textContent = '';
        if (invite.guild.icon_url) {
          var img = document.createElement('img');
          img.alt = '';
          img.src = /^https?:/.test(invite.guild.icon_url) ? invite.guild.icon_url : API + invite.guild.icon_url;
          img.onerror = function () { icon.textContent = initials(invite.guild.name); };
          icon.appendChild(img);
        } else {
          icon.textContent = initials(invite.guild.name);
        }
        state = 'valid';
        render();
      })
      .catch(function () { state = 'invalid'; render(); });
  }
  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase();
  }
  render();
})();
</script>
</body>
</html>
